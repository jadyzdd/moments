<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1a1a" />
  <meta name="description" content="类似微信朋友圈的日常生活可分享网页" />
  <title>朋友圈</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css?v=bgm10" />
</head>
<body>
  <div class="app" id="app">
    <!-- 顶部封面（微信朋友圈原版布局：头像骑缝、昵称在封面上、简介在封面下） -->
    <header class="cover" id="cover">
      <div class="cover-bg" aria-hidden="true"></div>
      <button type="button" class="cover-camera" title="更换封面" aria-label="更换封面">📷</button>
      <button type="button" class="music-fab is-muted is-unset" id="btnMusic" aria-label="背景音乐" title="背景音乐" aria-pressed="false">
        <span class="music-fab-ring" aria-hidden="true"></span>
        <span class="music-fab-disc" aria-hidden="true">♪</span>
      </button>
      <div class="profile">
        <h1 class="nickname" id="nickname">小明</h1>
        <div class="avatar profile-avatar" id="myAvatar" title="我的头像">明</div>
      </div>
    </header>
    <p class="bio" id="bio">记录生活的点滴 · 今天也要开心呀</p>

    <!-- 动态流 -->
    <main class="feed" id="feed" aria-live="polite"></main>

    <!-- 空状态 -->
    <div class="empty-state hidden" id="emptyState">
      <div class="empty-icon">🍃</div>
      <p>还没有动态</p>
      <p class="empty-hint">进入底部「管理」→「发布」添加第一条，或恢复示例数据</p>
      <button type="button" class="btn-secondary" id="btnRestoreEmpty">恢复示例</button>
    </div>

    <!-- 页脚 -->
    <footer class="footer">
      <button type="button" class="footer-link" id="btnClear">清空本地数据</button>
      <span class="footer-sep">·</span>
      <button type="button" class="footer-link" id="btnRestore">恢复示例</button>
      <span class="footer-sep">·</span>
      <button type="button" class="footer-link" id="btnAdmin">管理</button>
    </footer>

    <!-- 悬浮滚动 -->
    <div class="scroll-fabs" id="scrollFabs">
      <button type="button" class="scroll-fab hidden" id="btnScrollTop" title="回到顶部" aria-label="回到顶部">↑</button>
      <button type="button" class="scroll-fab" id="btnScrollBottom" title="直达底部" aria-label="直达底部">↓</button>
    </div>
    <audio id="bgMusic" preload="none" loop playsinline></audio>
    <!-- 年月定位入口（微信朋友圈风格） -->
    <button type="button" class="ym-entry" id="btnYm" aria-label="按年月查找" title="按年月查找">年月</button>
  </div>

  <!-- 图片灯箱（微信朋友圈风格） -->
  <div class="lightbox hidden" id="lightbox" role="dialog" aria-modal="true" aria-label="图片预览">
    <div class="lightbox-backdrop" aria-hidden="true"></div>
    <button type="button" class="lightbox-close" id="lightboxClose" aria-label="关闭">×</button>
    <button type="button" class="lightbox-nav lightbox-prev hidden" id="lightboxPrev" aria-label="上一张">‹</button>
    <div class="lightbox-stage" id="lightboxStage">
      <img class="lightbox-img" id="lightboxImg" alt="预览图" />
    </div>
    <button type="button" class="lightbox-nav lightbox-next hidden" id="lightboxNext" aria-label="下一张">›</button>
    <div class="lightbox-counter hidden" id="lightboxCounter"></div>
    <div class="lightbox-caption hidden" id="lightboxCaption"></div>
  </div>


  <!-- 管理密码门 -->
  <div class="modal-mask hidden" id="adminPwMask" role="dialog" aria-modal="true" aria-labelledby="adminPwTitle">
    <div class="modal admin-pw-modal">
      <div class="modal-header">
        <button type="button" class="modal-cancel" id="adminPwCancel">取消</button>
        <h2 class="modal-title" id="adminPwTitle">管理入口</h2>
        <button type="button" class="modal-ok" id="adminPwSubmit">解锁</button>
      </div>
      <div class="admin-pw-body">
        <p class="admin-pw-hint">输入管理密码以编辑本地动态（数据仅保存在本浏览器）。</p>
        <input type="password" id="adminPwInput" class="admin-pw-input" placeholder="密码" autocomplete="current-password" />
        <p class="admin-pw-error hidden" id="adminPwError" role="alert"></p>
      </div>
    </div>
  </div>

  <!-- 管理面板 -->
  <div class="admin-panel hidden" id="adminPanel" role="dialog" aria-modal="true" aria-label="管理面板">
    <div class="admin-panel-inner">
      <header class="admin-header">
        <button type="button" class="admin-header-btn" id="adminClose" aria-label="关闭">←</button>
        <div class="admin-header-titles">
          <h2>本地管理</h2>
          <p class="admin-count" id="adminCount">共 0 条</p>
        </div>
        <button type="button" class="admin-header-btn" id="adminYm" title="按年月定位" aria-label="按年月定位">年月</button>
        <button type="button" class="admin-header-btn accent" id="adminNew">发布</button>
      </header>

      <nav class="admin-tabs" id="adminTabs" role="tablist" aria-label="管理分类">
        <button type="button" class="admin-tab is-active" id="adminTabPosts" role="tab" aria-selected="true" data-tab="posts">动态</button>
        <button type="button" class="admin-tab" id="adminTabProfile" role="tab" aria-selected="false" data-tab="profile">封面与资料</button>
      </nav>

      <section class="gh-sync" id="ghSyncSection" aria-label="同步到 GitHub">
        <input type="hidden" id="ghOwner" value="jadyzdd" />
        <input type="hidden" id="ghRepo" value="moments" />
        <input type="hidden" id="ghBranch" value="main" />
        <!-- Token UI removed; stored in localStorage. 「保存」用弹窗更新。 -->
        <input type="password" id="ghToken" class="visually-hidden-file" value="" tabindex="-1" aria-hidden="true" autocomplete="off" />
        <div class="gh-actions gh-actions-only">
          <button type="button" class="admin-tool" id="ghSaveToken">保存令牌</button>
          <button type="button" class="admin-tool muted" id="ghClearToken" title="仅清除本机 Token，不会改仓库">清除令牌</button>
          <button type="button" class="gh-sync-btn" id="ghSyncBtn">同步</button>
        </div>
        <p class="gh-token-state" id="ghTokenState"></p>
        <p class="gh-last-sync" id="ghLastSync">尚未同步</p>
        <p class="gh-sync-status hidden" id="ghSyncStatus" role="status" aria-live="polite"></p>
      </section>

      <div class="admin-tab-panel" id="adminPanelPosts" role="tabpanel" data-panel="posts">
        <div class="admin-toolbar">
          <button type="button" class="admin-tool" id="adminExport">导出 JSON</button>
          <button type="button" class="admin-tool" id="adminImportReplace">导入替换</button>
          <button type="button" class="admin-tool" id="adminImportMerge">导入合并</button>
          <button type="button" class="admin-tool" id="adminChangePw">改密码</button>
          <button type="button" class="admin-tool muted" id="adminLock">锁定</button>
          <input type="file" id="adminImportFile" accept="application/json,.json" class="visually-hidden-file" />
        </div>
        <div class="admin-list" id="adminList"></div>
      </div>

      <div class="admin-tab-panel hidden" id="adminPanelProfile" role="tabpanel" data-panel="profile" hidden>
        <section class="admin-profile" id="adminProfileSection" aria-label="封面与资料">
          <label class="admin-field">
            <span>昵称</span>
            <input type="text" id="adminProfileName" maxlength="20" placeholder="昵称" />
          </label>
          <label class="admin-field">
            <span>简介</span>
            <input type="text" id="adminProfileBio" maxlength="60" placeholder="个性签名 / 简介" />
          </label>
          <div class="admin-profile-media">
            <div class="admin-profile-media-col">
              <span class="admin-profile-label">封面图</span>
              <div class="admin-profile-preview cover" id="adminCoverPreview" aria-hidden="true"></div>
              <div class="admin-upload-row">
                <label class="btn-secondary admin-add-img" for="adminCoverFile">选封面图</label>
                <button type="button" class="admin-tool muted" id="adminCoverClear">清除</button>
                <input type="file" id="adminCoverFile" class="visually-hidden-file" accept="image/*" />
              </div>
            </div>
            <div class="admin-profile-media-col">
              <span class="admin-profile-label">头像</span>
              <div class="admin-profile-preview avatar" id="adminAvatarPreview" aria-hidden="true">明</div>
              <div class="admin-upload-row">
                <label class="btn-secondary admin-add-img" for="adminAvatarFile">选头像</label>
                <button type="button" class="admin-tool muted" id="adminAvatarClear">清除</button>
                <input type="file" id="adminAvatarFile" class="visually-hidden-file" accept="image/*" />
              </div>
            </div>
          </div>
          <div class="admin-profile-row">
            <span class="admin-profile-label">背景音乐</span>
            <p class="admin-music-hint" id="adminMusicHint">未设置。请上传 mp3/m4a（最大约 15MB，文件名任意）。选好后会立刻上传到仓库；需已保存 GitHub 令牌。</p>
            <div class="admin-profile-actions">
              <label class="btn-secondary admin-add-img" for="adminMusicFile">选音乐</label>
              <button type="button" class="admin-tool muted" id="adminMusicClear">清除</button>
              <input type="file" id="adminMusicFile" class="visually-hidden-file" accept="audio/mpeg,audio/mp4,audio/aac,audio/ogg,audio/wav,.mp3,.m4a,.aac,.ogg,.wav" />
            </div>
            <input type="text" id="adminMusicUrl" maxlength="500" autocomplete="off" spellcheck="false" placeholder="可选：音频直链或以 assets/music/ 开头的仓库路径" />
          </div>
          <p class="admin-img-tip" id="adminProfileTip">保存后仅本机生效；点「同步」才会推送到仓库供访客看到。</p>
          <div class="admin-profile-actions">
            <button type="button" class="admin-tool" id="adminProfileSave">保存资料</button>
          </div>
        </section>
      </div>


      <!-- 编辑/新建表单 -->
      <div class="admin-editor hidden" id="adminEditor">
        <div class="admin-editor-sheet">
          <div class="modal-header">
            <button type="button" class="modal-cancel" id="adminEditCancel">取消</button>
            <h2 class="modal-title" id="adminEditorTitle">发布动态</h2>
            <button type="button" class="modal-ok" id="adminEditSave">保存</button>
          </div>
          <div class="admin-editor-body">
            <label class="admin-field">
              <span>文字</span>
              <textarea id="adminEditText" rows="4" maxlength="500" placeholder="这一刻的想法…"></textarea>
            </label>
            <label class="admin-field">
              <span>地点</span>
              <input type="text" id="adminEditLocation" maxlength="40" placeholder="所在位置（可选）" />
            </label>
            <label class="admin-field">
              <span>日期时间</span>
              <input type="datetime-local" id="adminEditDatetime" />
            </label>
            <div class="admin-field">
              <span>图片</span>
              <div class="admin-edit-images" id="adminEditImages"></div>
              <div class="admin-upload-row">
                <label class="btn-secondary admin-add-img" id="adminEditAddImg" for="adminEditFiles">选择图片上传</label>
                <input type="file" id="adminEditFiles" class="visually-hidden-file" accept="image/*" multiple />
              </div>
              <p class="admin-img-tip" id="adminUploadTip">最多 9 张；保存后点「同步」才会上传到仓库。</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 年月选择（微信原版滚轮） -->
  <div class="modal-mask hidden" id="ymMask" role="dialog" aria-modal="true" aria-labelledby="ymTitle">
    <div class="modal ym-picker-modal">
      <h2 class="ym-picker-title" id="ymTitle">请选择发表的日期</h2>
      <div class="ym-picker" id="ymPicker">
        <div class="ym-picker-highlight" aria-hidden="true"></div>
        <div class="ym-picker-fade ym-picker-fade-top" aria-hidden="true"></div>
        <div class="ym-picker-fade ym-picker-fade-bottom" aria-hidden="true"></div>
        <div class="ym-picker-cols">
          <div class="ym-picker-col" id="ymYearCol" tabindex="0" role="listbox" aria-label="年"></div>
          <div class="ym-picker-col" id="ymMonthCol" tabindex="0" role="listbox" aria-label="月"></div>
        </div>
      </div>
      <p class="ym-empty-hint hidden" id="ymEmptyHint">暂无动态可定位</p>
      <div class="ym-picker-actions">
        <button type="button" class="ym-picker-cancel" id="btnYmClose">取消</button>
        <button type="button" class="ym-picker-confirm" id="btnYmConfirm">确定</button>
      </div>
    </div>
  </div>

  <!-- 轻提示 toast -->
  <div class="toast hidden" id="toast" role="status" aria-live="polite"></div>

  <script src="data.js?v=bgm9"></script>
  <script src="app.js?v=bgm10"></script>
  <script src="admin.js?v=bgm10"></script>
</body>
</html>
